<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="assets/style.css?v=9">
<style>
/* Spécifique à Tab → Gamme */
textarea{width:100%;min-height:160px;font:13px/1.35 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:10px;white-space:pre;overflow-x:auto;margin:0 0 12px}
.seq{font-size:13px;margin-top:10px;line-height:1.7}
.seq span{display:inline-block;margin-right:10px;white-space:nowrap}
.seq i{font-style:normal;color:var(--mut)}
.out,.err{color:var(--out)}
.wrap{overflow-x:auto}
.card h2 .chg{color:var(--acc)}
.pos{display:inline-block;font-size:13px;font-weight:600;color:var(--acc);background:var(--accL);border-radius:6px;padding:2px 8px;margin-bottom:6px}
.expl{font-size:13px;margin-top:8px;line-height:1.5}
/* Mesure : tablature à gauche, manche à droite (ordinateur) ; empilés sur mobile */
/* Mesure : tablature et manche répartis sur la largeur (ordinateur) ; empilés sur mobile.
   Le manche a toujours la même hauteur, quelle que soit la mesure. */
.mgrid{display:flex;justify-content:space-around;align-items:center;gap:16px 32px}
.mright svg{height:230px!important;width:auto!important;max-width:100%!important}
.mleft{min-width:240px}
.mleft .mt{font-size:15px;line-height:1.55;margin:0 0 6px}
.playm{margin-left:auto;font-size:14px;padding:6px 12px;min-height:36px}
.playm.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pn .ring{opacity:0}
.pn.hot .ring{opacity:1}
.seq span.hot{background:var(--accL);border-radius:6px;box-shadow:0 0 0 3px var(--accL)}
.lbl0{font-size:12px;font-weight:600;color:var(--mut);margin:8px 0 2px}
@media(max-width:640px){
  .mgrid{flex-direction:column;align-items:stretch}
  .mright svg{width:100%!important;height:auto!important}

  .mleft .mt{font-size:14px}
}
.lbl{font-size:12px;font-weight:600;color:var(--root);margin:8px 0 2px}

.mv{color:var(--root)}

.sugg button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
</style></head><body><main>
<p class="brand">Guitar tools</p>
<nav class="tabs" id="tabs"></nav>
<h1>Tab → Gamme</h1>
<p class="sub">Colle une tablature : pour chaque mesure, la gamme sur le manche, la position de la main et l'ordre des notes à jouer.</p>
<div class="panel">
  <textarea id="tab" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Tablature"></textarea>
  <div class="fields">
    <label class="field">Tonique <select id="root"></select></label>
    <label class="field">Gamme <select id="scale"></select></label>
    <label class="field">Points <select id="lab"><option value="both">notes + degrés</option><option value="name">notes</option><option value="deg">degrés</option></select></label>
    <label class="field">Noms <select id="nom"><option value="fr">Do Ré Mi</option><option value="en">C D E</option></select></label>
    <label class="check"><input type="checkbox" id="per" checked> Gamme par mesure</label>
    <label class="check"><input type="checkbox" id="fix" checked> Corriger les doigtés</label>
    <button class="pri grow" id="go">Analyser</button>
  </div>
</div>
<div class="info" id="info"></div>
<div class="sugg" id="sugg"></div>
<div class="strip" id="strip"></div>
<div class="legend">
  <span><span class="dot play"></span>note jouée (n° = ordre)</span>
  <span><span class="dot scale"></span>note de la gamme</span>
  <span><span class="dot root"></span>tonique</span>
  <span><span class="dot outs"></span>hors gamme</span>
  <span><span class="dot box"></span>position de la main</span>
  <span><span class="dot offp"></span>hors position</span>
</div>
<div id="out"></div>
<div id="full"></div>
<footer>Fait par <a href="https://www.lophius.be">Lophius</a>. Tout se calcule dans ton navigateur.</footer>
</main>
<script src="assets/nav.js?v=5"></script>
<script>
const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLT=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const FR=['Do','Do#','Ré','Mib','Mi','Fa','Fa#','Sol','Lab','La','Sib','Si'];
const FRS=['Do','Do#','Ré','Ré#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
const FRF=['Do','Réb','Ré','Mib','Mi','Fa','Solb','Sol','Lab','La','Sib','Si'];
const IV=['1','b2','2','b3','3','4','b5','5','b6','6','b7','7'];
const SCALES={
  maj:{n:'Majeure',i:[0,2,4,5,7,9,11],p:8},
  min:{n:'Mineure naturelle',i:[0,2,3,5,7,8,10],p:8},
  pmin:{n:'Penta mineure',i:[0,3,5,7,10],p:4},
  pmaj:{n:'Penta majeure',i:[0,2,4,7,9],p:4},
  harm:{n:'Mineure harmonique',i:[0,2,3,5,7,8,11],p:3},
  dor:{n:'Dorien',i:[0,2,3,5,7,9,10],p:2},
  mix:{n:'Mixolydien',i:[0,2,4,5,7,9,10],p:2}
};
const MINORISH=['min','pmin','dor','harm'];
const OPEN=[64,59,55,50,45,40], SN=['e','B','G','D','A','E'];
const EX=`e|-------0-----|---------0---|---5-7-8-7-5-|
B|-----1---1---|-------1---1-|-5-----------|
G|---2-------2-|-----0-------|-------------|
D|-2-----------|---2---------|-------------|
A|-------------|-3-----------|-------------|
E|-------------|-------------|-------------|`;
const $=id=>document.getElementById(id);
$('tab').value=EX;
$('root').innerHTML='<option value="auto">Auto</option>'+FR.map((n,i)=>`<option value="${i}">${n} (${SH[i]})</option>`).join('');
$('scale').innerHTML='<option value="auto">Auto</option>'+Object.entries(SCALES).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('');
const isD=c=>c>='0'&&c<='9';

function parse(txt){
  const blocks=[];let cur=[];
  for(const l of txt.split(/\r?\n/)){
    const m=l.match(/^\s*[A-Ga-g][#b]?\s*([|:\-].*)$/);
    if(m&&/-/.test(m[1])){cur.push(m[1]);if(cur.length===6){blocks.push(cur);cur=[];}}
    else cur=[];
  }
  // Chaque corde est découpée sur ses propres "|" : la mesure n°i = le i-ème segment
  // de chaque ligne, même si les barres ne sont pas alignées verticalement.
  const measures=[];
  for(const b of blocks){
    const segs=b.map(l=>l.replace(/:/g,'|').split('|'));
    // on retire le segment vide avant la 1re barre et après la dernière
    segs.forEach(sg=>{if(sg.length&&!sg[0].trim())sg.shift();if(sg.length&&!sg[sg.length-1].trim())sg.pop();});
    const n=Math.max(...segs.map(sg=>sg.length));
    for(let i=0;i<n;i++){
      const raw=segs.map(sg=>sg[i]||''),notes=[];
      raw.forEach((seg,s)=>{
        for(let c=0;c<seg.length;c++){
          if(isD(seg[c])&&!isD(seg[c-1])){
            let num=seg[c];if(isD(seg[c+1]))num+=seg[c+1];
            const f=+num;notes.push({col:c,s,f,pc:(OPEN[s]+f)%12});
          }
        }
      });
      // ordre : notes à la même position dans la mesure = même temps (accord)
      notes.sort((a,b)=>a.col-b.col||a.s-b.s);let o=0,lc=-1;
      notes.forEach(x=>{if(x.col!==lc){o++;lc=x.col;}x.o=o;});
      measures.push({notes,raw});
    }
  }
  return measures;
}

function rank(ns,roots,sks,pref){
  if(!ns.length)return [];
  let lm=1e9,low=0;ns.forEach(n=>{const p=OPEN[n.s]+n.f;if(p<lm){lm=p;low=n.pc;}});
  const first=ns[0].pc,last=ns[ns.length-1].pc,res=[];
  for(const r of roots)for(const sk of sks){
    const iv=SCALES[sk].i,inS=ns.filter(n=>iv.includes((n.pc-r+12)%12)).length;
    let sc=inS/ns.length*1000+(low===r?40:0)+(last===r?25:0)+(first===r?10:0)+SCALES[sk].p;
    if(pref){if(pref.r===r&&pref.sk===sk)sc+=30;else if(pref.r===r)sc+=12;}
    res.push({r,sk,inS,n:ns.length,sc});
  }
  return res.sort((a,b)=>b.sc-a.sc);
}
function namesFor(r,sk){
  const fl=[5,10,3,8,1].includes(r)||MINORISH.includes(sk)&&[2,7,0,5].includes(r);
  return $('nom').value==='fr'?(fl?FRF:FRS):(fl?FLT:SH);
}
const label=c=>{const nm=namesFor(c.r,c.sk);return nm[c.r]+' '+SCALES[c.sk].n.toLowerCase();};

// Position = bloc de 4 cases (index sur la case p) qui contient le plus de notes jouées.
// p=1 inclut les cordes à vide.
const inBox=(f,p)=>f===0?p===1:f>=p&&f<=p+3;
// Autres façons de jouer la même note (même hauteur) dans la position p
function alts(n,p){
  const m=OPEN[n.s]+n.f,r=[];
  for(let s=0;s<6;s++){const f=m-OPEN[s];if(f>=0&&f<=22&&inBox(f,p))r.push({s,f});}
  return r;
}
// Choix de la position : le moins de notes impossibles à y jouer, puis le moins de notes à déplacer
function position(ns,fix){
  const fr=ns.map(n=>n.f),nz=fr.filter(f=>f>0),ref=nz.length?Math.min(...nz):1;
  let bp=1,bs=1e9;
  for(let p=1;p<=Math.max(1,...fr);p++){
    const out=ns.filter(n=>!inBox(n.f,p)),stuck=fix?out.filter(n=>!alts(n,p).length).length:out.length;
    const sc=stuck*1000+out.length*10+Math.abs(p-ref);
    if(sc<bs){bs=sc;bp=p;}
  }
  return bp;
}
// Déplace les notes hors position vers une corde/case équivalente dans la position
function relocate(ns,p){
  const moved=[];
  ns.forEach(n=>{
    if(inBox(n.f,p))return;
    const busy=ns.filter(x=>x!==n&&x.o===n.o).map(x=>x.s);
    const c=alts(n,p).filter(a=>!busy.includes(a.s)).sort((a,b)=>Math.abs(a.s-n.s)-Math.abs(b.s-n.s))[0];
    if(c){moved.push({n,from:{s:n.s,f:n.f}});n.s=c.s;n.f=c.f;}
  });
  return moved;
}
// Réécrit une mesure en tablature texte à partir des notes (doigtés corrigés)
function segOf(ns,raw){
  const L=Math.max(...raw.map(r=>r.length),1),rows=SN.map(()=>Array(L).fill('-'));
  ns.forEach(n=>{const t=String(n.f);for(let k=0;k<t.length;k++)if(n.col+k<L)rows[n.s][n.col+k]=t[k];});
  return rows.map(r=>r.join(''));
}
const ROM=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI','XVII'];
function board(ns,root,iv,lab,names,p,tabs){
  tabs=tabs||[];
  let lo=Math.min(...ns.map(n=>n.f)),hi=Math.max(...ns.map(n=>n.f));
  lo=Math.max(0,Math.min(lo,p)-1);if(lo===1)lo=0;hi=Math.max(hi+1,p+4,lo+4);
  const first=Math.max(lo,1),fw=50,sh=lab==='both'?38:28,left=lo===0?50:30,top=16;
  const nCols=hi-first+1,W=left+nCols*fw+8,H=top+5*sh+(lab==="both"?40:28);
  const x=f=>f===0?left-18:left+(f-first+0.5)*fw,y=s=>top+s*sh;
  let g='';
  {const x0=p===1?(lo===0?left-34:left):x(p)-fw/2,x1=x(p+3)+fw/2;
   g+=`<rect x="${x0}" y="${top-14}" width="${x1-x0}" height="${5*sh+28}" rx="10" fill="var(--accL)" stroke="var(--acc)" stroke-opacity=".55" stroke-width="1.5"/>`;}
  for(let k=0;k<=nCols;k++){const xx=left+k*fw;g+=`<line x1="${xx}" y1="${top}" x2="${xx}" y2="${y(5)}" stroke="var(--line2)" stroke-width="${k===0&&first===1?5:1.5}"/>`;}
  for(let f=first;f<=hi;f++){if([3,5,7,9,12,15,17,19,21].includes(f))g+=`<text x="${x(f)}" y="${H-6}" font-size="11" text-anchor="middle" fill="${f===12?'var(--fg)':'var(--mut)'}">${f}</text>`;}
  for(let s=0;s<6;s++){g+=`<line x1="${left}" y1="${y(s)}" x2="${W-8}" y2="${y(s)}" stroke="var(--str)" stroke-width="${0.8+s*0.3}"/>${tabs.length?'':`<text x="${lo===0?6:4}" y="${y(s)+4}" font-size="11" fill="var(--mut)">${SN[s]}</text>`}`;}
  const played={};ns.forEach(n=>{const k=n.s+'-'+n.f;(played[k]=played[k]||{n,o:[]}).o.push(n.o);});
  for(let s=0;s<6;s++)for(let f=lo;f<=hi;f++){
    const pc=(OPEN[s]+f)%12,d=(pc-root+12)%12,k=s+'-'+f,inS=iv.includes(d),box=inBox(f,p);
    const cx=x(f),cy=y(s),nm=names[pc],main=lab==='deg'?IV[d]:nm;
    const sub=lab==='both'?`<text x="${cx}" y="${cy+21}" font-size="8.5" text-anchor="middle" fill="var(--mut)">${IV[d]}</text>`:'';
    if(played[k]){
      const o=played[k].o.join(','),fs=o.length>3?8:o.length>1?10:12;
      const col=inS?'var(--acc)':'var(--out)';
      const nl=lab==='deg'?'':`<text x="${cx+13}" y="${cy-8}" font-size="9.5" font-weight="700" fill="${col}">${nm}</text>`;
      g+=`<g class="pn" data-o="${o}"><circle class="ring" cx="${cx}" cy="${cy}" r="17" fill="none" stroke="var(--acc)" stroke-width="3"/>`+(box?'':`<circle cx="${cx}" cy="${cy}" r="15" fill="none" stroke="${col}" stroke-width="1.5" stroke-dasharray="3 2.5"/>`)+`<circle cx="${cx}" cy="${cy}" r="11.5" fill="${col}" ${d===0?'stroke="var(--root)" stroke-width="2.5"':''}/><text x="${cx}" y="${cy+fs*0.36}" font-size="${fs}" font-weight="700" text-anchor="middle" fill="#fff">${o}</text></g>${nl}${sub}`;
    }else if(inS){
      const fs=main.length>3?7.5:main.length>2?8.5:9.5;
      g+=`<g opacity="${box?1:.3}"><circle cx="${cx}" cy="${cy}" r="10.5" fill="var(--card)" stroke="${d===0?'var(--root)':'var(--str)'}" stroke-width="${d===0?2:1}"/><text x="${cx}" y="${cy+fs*0.36}" font-size="${fs}" text-anchor="middle" fill="${d===0?'var(--root)':'var(--fg)'}" font-weight="${d===0?700:500}">${main}</text>${sub}</g>`;
    }
  }
  // Tablature dessinée à gauche, chaque ligne alignée sur sa corde
  const CW=7.8,FS=13,dy=tabs.length?20:0;let ox=0,tg='';
  tabs.forEach(t=>{const len=Math.max(...t.rows.map(r=>r.length))+3;
    tg+=`<text x="${ox}" y="11" font-size="11" font-weight="600" fill="${t.strong?'var(--root)':'var(--mut)'}">${t.label}</text>`;
    t.rows.forEach((r,si)=>{tg+=`<text x="${ox}" y="${dy+y(si)+4.5}" font-size="${FS}" font-family="ui-monospace,Menlo,Consolas,monospace" fill="${t.strong?'var(--fg)':'var(--mut)'}" xml:space="preserve">${SN[si]}|${r.replace(/</g,'&lt;')}|</text>`;});
    ox+=len*CW+14;});
  const TW=W+ox,TH=H+dy;
  return `<svg viewBox="0 0 ${TW} ${TH}" width="${TW}" style="width:100%;max-width:${TW}px;height:auto" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">${tg}<g transform="translate(${ox},${dy})">${g}</g></svg>`;
}

function run(){
  if(typeof stopPlay==='function')stopPlay();
  const out=$('out'),info=$('info');out.innerHTML='';$('sugg').innerHTML='';$('strip').innerHTML='';
  const ms=parse($('tab').value);
  if(!ms.length){info.innerHTML='<span class="err">Aucune tablature reconnue. Il faut 6 lignes qui commencent par le nom de la corde (e|, B|, G|, D|, A|, E|).</span>';return;}
  const all=ms.flatMap(m=>m.notes);
  if(!all.length){info.innerHTML='<span class="err">Aucune note trouvée dans la tablature.</span>';return;}
  const rv=$('root').value,sv=$('scale').value,lab=$('lab').value,per=$('per').checked;
  const roots=rv==='auto'?[...Array(12).keys()]:[+rv],sks=sv==='auto'?Object.keys(SCALES):[sv];
  const ranked=rank(all,roots,sks),G=ranked[0];
  // suggestions : les meilleures gammes pour l'ensemble du morceau
  if(ranked.length>1){
    const top=ranked.slice(0,4);
    $('sugg').innerHTML='Meilleures gammes : '+top.map((c,i)=>`<button data-r="${c.r}" data-s="${c.sk}" class="${i?'':'on'}">${label(c)} · ${Math.round(c.inS/c.n*100)}%</button>`).join('');
    $('sugg').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('root').value=b.dataset.r;$('scale').value=b.dataset.s;run();});
  }
  const gn=namesFor(G.r,G.sk),giv=SCALES[G.sk].i;
  $('strip').innerHTML=giv.map(i=>`<div class="n ${i?'':'r'}"><b>${gn[(G.r+i)%12]}</b><small>${IV[i]}</small></div>`).join('');
  info.innerHTML=`Gamme principale : <b>${label(G)}</b> — ${G.inS}/${G.n} notes dans la gamme`+(per?'. Chaque mesure peut prendre sa propre gamme si une autre colle mieux.':'');
  MEAS=[];const fixed=[];REP={title:label(G),cov:`${G.inS}/${G.n}`,scale:giv.map(i=>gn[(G.r+i)%12]+' ('+IV[i]+')').join('  '),ms:[]};
  ms.forEach(({notes:ns,raw},i)=>{
    const tab=`<pre class="mt">${raw.map((r,s)=>SN[s]+'|'+r.replace(/</g,'&lt;')+'|').join('\n')}</pre>`;
    if(!ns.length){fixed.push(raw);REP.ms.push({h:`Mesure ${i+1}`,raw,silence:true});out.insertAdjacentHTML('beforeend',`<div class="card"><h2>Mesure ${i+1}</h2>${tab}<div class="seq"><i>Pas de note (silence)</i></div></div>`);return;}
    let C=G;
    if(per){
      // On garde la tonique principale si une de ses gammes couvre ≥ 75 % de la mesure
      // (une note de passage chromatique ne doit pas faire changer de tonalité).
      const rk=rank(ns,roots,sks,G),same=rk.find(c=>c.r===G.r);
      const gIn=ns.filter(n=>giv.includes((n.pc-G.r+12)%12)).length;
      const c=same&&same.inS/same.n>=0.75?same:rk[0];
      C=c.inS>gIn?c:{...G,inS:gIn,n:ns.length};
    }
    else C={...G,inS:ns.filter(n=>giv.includes((n.pc-G.r+12)%12)).length,n:ns.length};
    const root=C.r,iv=SCALES[C.sk].i,names=namesFor(C.r,C.sk),chg=C.r!==G.r||C.sk!==G.sk;
    const groups={};ns.forEach(n=>(groups[n.o]=groups[n.o]||[]).push(n));
    const seq=Object.entries(groups).map(([o,g])=>{
      const t=g.map(n=>{const d=(n.pc-root+12)%12,bad=!iv.includes(d);return `<span class="${bad?'out':''}" style="margin:0">${names[n.pc]} <i>(${IV[d]})</i></span>`;}).join(' + ');
      return `<span data-o="${o}"><b>${o}</b> ${t}</span>`;}).join('');
    const fix=$('fix').checked,p=position(ns,fix),moved=fix?relocate(ns,p):[],notIn=ns.filter(n=>!inBox(n.f,p));
    const seg=segOf(ns,raw);fixed.push(seg);
    const outS=[...new Set(ns.map(n=>n.pc).filter(pc=>!iv.includes((pc-root+12)%12)))];
    const expl=[];
    outS.forEach(pc=>{
      let a=pc,b=pc;do a=(a+11)%12;while(!iv.includes((a-root+12)%12));do b=(b+1)%12;while(!iv.includes((b-root+12)%12));
      expl.push(`<span class="out"><b>${names[pc]}</b> n'est pas dans la gamme : elle se glisse entre ${names[a]} (${IV[(a-root+12)%12]}) et ${names[b]} (${IV[(b-root+12)%12]}).</span>`);
    });
    moved.forEach(({n,from})=>expl.push(`<span class="mv"><b>${names[n.pc]}</b> déplacé : corde ${SN[from.s]} case ${from.f} → corde ${SN[n.s]} case ${n.f}, pour rester dans la position.</span>`));
    if(notIn.length)expl.push(`<span>Hors position (cercle pointillé) : ${notIn.map(n=>`${names[n.pc]} case ${n.f} corde ${SN[n.s]}`).join(', ')}${notIn.length>1?'. Il faut déplacer la main pour les jouer.':'. Il faut déplacer la main pour la jouer.'}</span>`);
    const pos=`Position ${ROM[p]||p} · cases ${p===1?'0':p} à ${p+3}`;
    MEAS[i]=ns.map(n=>({o:n.o,midi:OPEN[n.s]+n.f}));

    out.insertAdjacentHTML('beforeend',`<div class="card"><h2>${head}<button class="playm" data-i="${i}">Écouter</button></h2><div class="mgrid"><div class="mleft"><div class="pos">${pos}</div><div class="lbl0">Tablature</div>${tab}${moved.length?`<div class="lbl">Doigté corrigé</div><pre class="mt fx">${seg.map((r,s)=>SN[s]+'|'+r+'|').join('\n')}</pre>`:''}</div><div class="mright">${svg}</div></div><div class="seq">${seq}</div>${expl.length?`<div class="expl">${expl.join('<br>')}</div>`:''}</div>`);

  const rowsTxt=[];
  for(let i=0;i<fixed.length;i+=4){
    const ch=fixed.slice(i,i+4);
    rowsTxt.push(SN.map((n,s)=>n+'|'+ch.map(m=>m[s]).join('|')+'|').join('\n'));

  const full=rowsTxt.join('\n\n');REP.full=full;
  $('full').innerHTML=`<div class="card"><h2>Tablature avec doigtés corrigés</h2><pre class="mt fx">${full.replace(/</g,'&lt;')}</pre><div class="fields" style="margin-top:10px"><button id="cp">Copier</button><button id="use">Mettre dans l'éditeur</button><button id="pdf" class="pri">Exporter en PDF</button><span id="cpm" class="info" style="margin:0"></span></div></div>`;
  $('cp').onclick=async()=>{try{await navigator.clipboard.writeText(full);$('cpm').textContent='Copié';}catch(e){$('cpm').textContent='Copie refusée : sélectionne le texte à la main';}};
  $('use').onclick=()=>{$('tab').value=full;run();window.scrollTo({top:0,behavior:'smooth'});};
}
// ---------- Écoute d'une mesure : notes dans l'ordre, accords plaqués, note entourée ----------
let MEAS=[],actx=null,ptimers=null,pbtn=null;
function pluck(t,midi){
  const f=440*Math.pow(2,(midi-69)/12),o=actx.createOscillator(),o2=actx.createOscillator(),gn=actx.createGain(),g2=actx.createGain(),lp=actx.createBiquadFilter();
  o.type='triangle';o.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;g2.gain.value=.25;
  lp.type='lowpass';lp.frequency.setValueAtTime(f*8,t);lp.frequency.exponentialRampToValueAtTime(f*1.5,t+.6);
  gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(.3,t+.008);gn.gain.exponentialRampToValueAtTime(.0001,t+1.6);
  o2.connect(g2).connect(lp);o.connect(lp);lp.connect(gn).connect(actx.destination);
  o.start(t);o2.start(t);o.stop(t+1.7);o2.stop(t+1.7);
}
function markO(card,o){card.querySelectorAll('[data-o]').forEach(e=>e.classList.toggle('hot',o>0&&e.dataset.o.split(',').map(Number).includes(o)));}
function stopPlay(){
  if(ptimers){ptimers.forEach(clearTimeout);ptimers=null;}
  if(pbtn){pbtn.classList.remove('on');pbtn.textContent='Écouter';markO(pbtn.closest('.card'),0);pbtn=null;}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.playm');if(!b)return;
  const again=b===pbtn;stopPlay();if(again)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume();}catch(err){return;}
  const notes=MEAS[+b.dataset.i]||[],card=b.closest('.card'),dt=.5,t0=actx.currentTime+.08;
  const steps=[...new Set(notes.map(n=>n.o))].sort((a,c)=>a-c);
  pbtn=b;b.classList.add('on');b.textContent='Stop';
  ptimers=steps.map((o,k)=>{notes.filter(n=>n.o===o).forEach(n=>pluck(t0+k*dt,n.midi));return setTimeout(()=>markO(card,o),(k*dt+.08)*1000);});
  ptimers.push(setTimeout(stopPlay,(steps.length*dt+.5)*1000));
});
let REP=null;
const LIGHT={'--bg':'#ffffff','--fg':'#1d1b18','--mut':'#8a847a','--line':'#d8d2c6','--acc':'#c2552d','--root':'#2d6a8f','--card':'#ffffff','--out':'#b3261e','--str':'#9c958a'};

// ---------- Export PDF (dessin vectoriel, pensé pour l'impression) ----------
const PC={ink:'#1d1b18',mut:'#77716a',line:'#cfc8bb',acc:'#c2552d',accL:'#f9e9e1',root:'#2d6a8f',rootL:'#e6f0f6',out:'#b3261e',str:'#8f887d',dot:'#a39c90'};
function pdfBoard(d,X,Y,maxW,m){
  const {ns,root,iv,names,p}=m;
  let lo=Math.min(...ns.map(n=>n.f)),hi=Math.max(...ns.map(n=>n.f));
  lo=Math.max(0,Math.min(lo,p)-1);if(lo===1)lo=0;hi=Math.max(hi+1,p+4,lo+4);
  const first=Math.max(lo,1),nCols=hi-first+1,openW=lo===0?8:0,lab=5;
  const fw=Math.min(15,(maxW-lab-openW-2)/nCols),sh=6.6,left=X+lab+openW,top=Y+4;
  const x=f=>f===0?left-openW/2-0.6:left+(f-first+0.5)*fw,y=s=>top+s*sh,W=lab+openW+nCols*fw;
  // zone de position
  const x0=p===1?(lo===0?left-openW:left):x(p)-fw/2,x1=x(p+3)+fw/2;
  d.setFillColor(PC.accL);d.setDrawColor(PC.acc);d.setLineWidth(0.3);d.roundedRect(x0,top-4,x1-x0,5*sh+8,2,2,'FD');
  // cases et cordes
  d.setDrawColor(PC.line);
  for(let k=0;k<=nCols;k++){d.setLineWidth(k===0&&first===1?1.2:0.3);d.line(left+k*fw,top,left+k*fw,y(5));}
  d.setFont('helvetica','normal');d.setFontSize(6.5);d.setTextColor(PC.mut);
  for(let f=first;f<=hi;f++)if([3,5,7,9,12,15,17,19,21].includes(f))d.text(String(f),x(f),y(5)+8,{align:'center'});
  for(let s=0;s<6;s++){d.setDrawColor(PC.str);d.setLineWidth(0.15+s*0.07);d.line(left,y(s),left+nCols*fw,y(s));d.setFont('helvetica','normal');d.setFontSize(7);d.setTextColor(PC.mut);d.text(SN[s],X,y(s)+1);}
  const played={};ns.forEach(n=>{const k=n.s+'-'+n.f;(played[k]=played[k]||[]).push(n.o);});
  for(let s=0;s<6;s++)for(let f=lo;f<=hi;f++){
    const pc=(OPEN[s]+f)%12,dg=(pc-root+12)%12,inS=iv.includes(dg),box=inBox(f,p),k=s+'-'+f,cx=x(f),cy=y(s),isR=dg===0;
    if(played[k]){
      const col=inS?PC.acc:PC.out,o=played[k].join(',');
      if(!box){d.setDrawColor(col);d.setLineWidth(0.3);d.setLineDashPattern([0.7,0.5],0);d.circle(cx,cy,3.1,'S');d.setLineDashPattern([],0);}
      d.setFillColor(col);if(isR){d.setDrawColor(PC.root);d.setLineWidth(0.6);d.circle(cx,cy,2.45,'FD');}else d.circle(cx,cy,2.45,'F');
      d.setFont('helvetica','bold');d.setFontSize(o.length>2?5:7);d.setTextColor('#ffffff');d.text(o,cx,cy+0.9,{align:'center'});
      d.setFontSize(6);d.setTextColor(col);d.text(pdfTxt(names[pc]),cx+2.8,cy-1.9);
      d.setFont('helvetica','normal');d.setFontSize(5);d.setTextColor(PC.mut);d.text(IV[dg],cx,cy+4.3,{align:'center'});
    }else if(inS){
      const fade=!box;
      d.setFillColor(fade?'#ffffff':(isR?PC.rootL:'#ffffff'));d.setDrawColor(isR?PC.root:(fade?'#ddd8cf':PC.dot));d.setLineWidth(isR?0.5:0.25);d.circle(cx,cy,2.2,'FD');
      const nm=pdfTxt(names[pc]);d.setFont('helvetica',isR?'bold':'normal');d.setFontSize(nm.length>3?4.6:5.6);
      d.setTextColor(fade?'#bdb7ad':(isR?PC.root:PC.ink));d.text(nm,cx,cy+0.75,{align:'center'});
      d.setFont('helvetica','normal');d.setFontSize(4.6);d.setTextColor(fade?'#cfc9bf':PC.mut);d.text(IV[dg],cx,cy+4.2,{align:'center'});
    }
  }
  return {w:W,h:5*sh+14};
}
async function makePdf(){
  const {jsPDF}=window.jspdf,d=new jsPDF({unit:'mm',format:'a4'}),M=14,PW=210-2*M,BOT=297-14;let y=M;
  const set=(sz,st,c,f)=>{d.setFont(f||'helvetica',st||'normal');d.setFontSize(sz);d.setTextColor(c||PC.ink);};
  const lh=sz=>sz*0.3528*1.35;
  const wrap=(t,sz,w)=>{set(sz);return d.splitTextToSize(pdfTxt(t),w);};
  const monoSize=(lines,w,max)=>Math.min(max,w/(Math.max(...lines.map(l=>l.length))*0.6*0.3528));
  // En-tête
  d.setFillColor(PC.ink);d.rect(0,0,210,24,'F');
  set(17,'bold','#ffffff');d.text('Tablature -> gamme',M,11);
  set(9.5,'normal','#e9e4da');d.text(pdfTxt(`Gamme principale : ${REP.title}  -  ${REP.cov} notes dans la gamme`),M,18);
  y=31;
  // Bande de la gamme
  const sc=REP.scale.split('  ').map(t=>t.match(/^(.*) \((.*)\)$/));
  const bw=Math.min(22,PW/sc.length-2);
  sc.forEach((m,i)=>{const bx=M+i*(bw+2),r=m[2]==='1';d.setFillColor(r?PC.rootL:'#ffffff');d.setDrawColor(r?PC.root:PC.line);d.setLineWidth(r?0.6:0.3);d.roundedRect(bx,y,bw,12,1.5,1.5,'FD');
    set(11,'bold',r?PC.root:PC.ink);d.text(pdfTxt(m[1]),bx+bw/2,y+5.6,{align:'center'});set(7.5,'normal',PC.mut);d.text(m[2],bx+bw/2,y+10,{align:'center'});});
  y+=17;
  // Légende
  let lx=M;const leg=(draw,t)=>{draw(lx+1.8,y);set(7.5,'normal',PC.mut);d.text(pdfTxt(t),lx+5,y+1);lx+=5+d.getTextWidth(pdfTxt(t))+6;};
  leg((cx,cy)=>{d.setFillColor(PC.acc);d.circle(cx,cy,1.8,'F');},'note jouée (n° = ordre)');
  leg((cx,cy)=>{d.setFillColor('#ffffff');d.setDrawColor(PC.dot);d.setLineWidth(.25);d.circle(cx,cy,1.8,'FD');},'note de la gamme');
  leg((cx,cy)=>{d.setFillColor(PC.rootL);d.setDrawColor(PC.root);d.setLineWidth(.5);d.circle(cx,cy,1.8,'FD');},'tonique');
  leg((cx,cy)=>{d.setFillColor(PC.out);d.circle(cx,cy,1.8,'F');},'hors gamme');
  leg((cx,cy)=>{d.setFillColor(PC.accL);d.setDrawColor(PC.acc);d.setLineWidth(.3);d.roundedRect(cx-1.8,cy-1.8,3.6,3.6,.6,.6,'FD');},'position de la main');
  y+=7;
  // Mesures
  const LW=50,RX=M+LW+5,RW=PW-LW-5;
  for(const m of REP.ms){
    const tabs=m.raw.map((r,s)=>SN[s]+'|'+r+'|'),segL=m.seg?m.seg.map((r,s)=>SN[s]+'|'+r+'|'):null;
    const ts=monoSize(tabs.concat(segL||[]),LW-3,8),tH=6*ts*0.3528*1.25;
    const leftH=tH+3+(segL?tH+7:0);
    const seqL=m.silence?[]:wrap('Ordre : '+m.seq,8.5,PW),exL=m.silence?[]:m.expl.map(e=>wrap('- '+e,8,PW));
    const boardH=m.silence?0:5*6.6+14;
    const blockH=9+Math.max(leftH,boardH)+seqL.length*lh(8.5)+exL.flat().length*lh(8)+6;
    if(y+blockH>BOT){d.addPage();y=M;}
    // titre de la mesure
    set(11.5,'bold');d.text(m.h,M,y+4);
    if(!m.silence){
      const tw=d.getTextWidth(m.h);set(9,'bold',m.chg?PC.acc:PC.ink);d.text(pdfTxt(m.sc),M+tw+4,y+4);
      const sw=d.getTextWidth(pdfTxt(m.sc));
      const pt=pdfTxt(m.pos);set(8,'bold','#ffffff');const pw=d.getTextWidth(pt)+5;
      const nt=pdfTxt(`${m.cov}  ·  ${m.notes}`),nx=M+tw+4+sw+3;set(8,'normal',PC.mut);
      if(nx+d.getTextWidth(nt)<M+PW-pw-3)d.text(nt,nx,y+4);else d.text(m.cov,nx,y+4);
      set(8,'bold','#ffffff');d.setFillColor(PC.acc);d.roundedRect(M+PW-pw,y,pw,5.6,1.4,1.4,'F');d.text(pt,M+PW-pw/2,y+3.9,{align:'center'});
    }
    y+=9;const y0=y;
    // tablatures
    set(ts,'normal',PC.mut,'courier');d.text(tabs,M,y+ts*0.3528,{lineHeightFactor:1.25});
    if(m.silence){set(9,'italic',PC.mut);d.text('Silence',RX,y+4);}
    let ly=y+tH+3;
    if(segL){set(7.5,'bold',PC.root);d.text('Doigté corrigé',M,ly+2.5);ly+=4.5;d.setFillColor(PC.root);d.rect(M,ly-0.5,0.8,tH+0.5,'F');set(ts,'normal',PC.ink,'courier');d.text(segL,M+2,ly+ts*0.3528,{lineHeightFactor:1.25});}
    if(!m.silence)pdfBoard(d,RX,y0,RW,m.model);
    y=y0+Math.max(leftH,boardH)+1;
    if(seqL.length){set(8.5,'normal');d.text(seqL,M,y+3);y+=seqL.length*lh(8.5);}
    exL.forEach((L,i)=>{const e=m.expl[i];set(8,'normal',/déplacé/.test(e)?PC.root:/pas dans la gamme/.test(e)?PC.out:PC.ink);d.text(L,M,y+3);y+=L.length*lh(8);});
    y+=3;d.setDrawColor(PC.line);d.setLineWidth(0.3);d.line(M,y,M+PW,y);y+=4;
  }

  d.addPage();y=M;set(13,'bold');d.text('Tablature avec doigtés corrigés',M,y+5);y+=11;
  for(const b of REP.full.split('\n\n')){

  }

  for(let i=1;i<=N;i++){d.setPage(i);set(7.5,'normal',PC.mut);d.text(pdfTxt(REP.title),M,292);d.text(`${i} / ${N}`,210-M,292,{align:'right'});}

}
document.addEventListener('click',async e=>{
