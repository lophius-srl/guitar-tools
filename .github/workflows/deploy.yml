name: Déploiement Cloudflare

# Désactivé tant que les secrets Cloudflare ne sont pas configurés : lancement manuel uniquement.
# Pour l'activer : remettre `push: branches: [main]` sous `on:`.
on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Déployer sur Cloudflare Workers (fichiers statiques)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy
